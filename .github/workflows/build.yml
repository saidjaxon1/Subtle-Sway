name: Build site

# Rebuilds every page whenever the data or the generator changes,
# including saves made from the admin panel (which commits data/*.json
# through the GitHub API). Generated files are committed back.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "assets/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: npm test

      - name: Build pages and commit them
        # Always build from the LATEST main, so a save that landed while this job
        # was running is included; retry if another push wins the race.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node scripts/build.mjs
            git add -A
            if git diff --cached --quiet; then
              echo "Pages already up to date."
              exit 0
            fi
            git commit -q -m "Rebuild pages [skip ci]"
            if git push -q origin HEAD:main; then
              echo "Pushed rebuilt pages."
              exit 0
            fi
            echo "Push lost a race (attempt $attempt), rebuilding on the newest main…"
            sleep $((attempt * 3))
          done
          echo "Could not push after 5 attempts." >&2
          exit 1
